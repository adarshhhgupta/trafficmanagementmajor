name: Urban Pulse CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic pydantic-settings pytest opencv-python-headless numpy torch ultralytics sqlalchemy asyncpg redis websockets python-multipart python-jose passlib

    - name: Run Pytest Suite
      run: |
        cd backend
        python -m pytest tests
